<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National Agencies Stock</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  margin: 0;
}
header {
  background: #123d70;
  color: white;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 700px;
  margin: auto;
  padding: 12px;
}
.card {
  background: white;
  padding: 16px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 7px #ddd;
}
input, select, button {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  box-sizing: border-box;
  border-radius: 7px;
  border: 1px solid #ccc;
  font-size: 16px;
}
button {
  background: #123d70;
  color: white;
  border: none;
  font-weight: bold;
}
.add { background: green; }
.remove { background: #d32f2f; }
.delete { background: #b71c1c; }
.product, .history {
  border-bottom: 1px solid #ddd;
  padding: 12px 0;
}
.product h3 { margin-bottom: 5px; }
.green { color: green; font-weight: bold; }
.red { color: red; font-weight: bold; }
.small {
  color: #666;
  font-size: 13px;
}
#status {
  font-weight: bold;
  margin: 8px 0;
}
</style>
</head>

<body>

<header>
<h2>NATIONAL AGENCIES</h2>
<p>Stock Management System</p>
</header>

<div class="container">

<div class="card">
<h3>Connection Status</h3>
<p id="status">Connecting to Firebase...</p>
</div>

<div class="card">
<h3>➕ Add New Product</h3>

<select id="category">
<option>Plywood</option>
<option>Rexine</option>
<option>Seat Covers</option>
<option>Tank Covers</option>
</select>

<input id="thickness" placeholder="Thickness (Example: 12mm)">
<input id="size" placeholder="Size (Example: 8x4)">

<input id="opening" type="number" min="0"
placeholder="Opening stock (sheets/units)">

<button onclick="addProduct()">ADD PRODUCT</button>
</div>

<div class="card">
<h3>📦 Update Stock</h3>

<select id="productSelect"></select>

<input id="amount" type="number" min="1"
placeholder="Enter quantity">

<button class="add" onclick="changeStock(1)">
ADD STOCK (+)
</button>

<button class="remove" onclick="changeStock(-1)">
REMOVE STOCK (-)
</button>

<p class="small">
Enter the quantity you want to add or remove.
</p>
</div>

<div class="card">
<h3>📊 AVAILABLE STOCK</h3>

<input id="search" placeholder="Search product..."
oninput="showProducts()">

<div id="products">Loading products...</div>
</div>

<div class="card">
<h3>🕘 STOCK HISTORY</h3>

<button class="delete" onclick="deleteHistory()">
DELETE HISTORY
</button>

<div id="history">Loading history...</div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

// FIREBASE CONFIGURATION
const firebaseConfig = {
  apiKey: "AIzaSyAnZ3TBaspSCvG5O-Va1d5n6A52PDwO9Sc",
  authDomain: "national-agencies-2595.firebaseapp.com",
  projectId: "national-agencies-2595",
  storageBucket: "national-agencies-2595.firebasestorage.app",
  messagingSenderId: "425159175771",
  appId: "1:425159175771:web:4d23822e704d62510b997e"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let products = [];

// CONNECTION

async function start() {
  const status = document.getElementById("status");

  try {
    if (!auth.currentUser) {
      await auth.signInAnonymously();
    }

    status.innerText = "Firebase login successful. Loading stock...";

    loadProducts();
    loadHistory();

  } catch (e) {
    status.innerText = "Connection error: " + e.message;
    document.getElementById("products").innerText =
      "Could not connect to Firebase.";
  }
}

// ADD PRODUCT

async function addProduct() {
  const category = document.getElementById("category").value;
  const thickness = document.getElementById("thickness").value.trim();
  const size = document.getElementById("size").value.trim();
  const openingValue = document.getElementById("opening").value;
  const quantity = Number(openingValue);

  if (
    !thickness ||
    !size ||
    openingValue === "" ||
    !Number.isInteger(quantity) ||
    quantity < 0
  ) {
    alert("Enter valid product details and stock quantity.");
    return;
  }

  const name = category + " " + thickness;

  try {
    const productRef = db.collection("products").doc();
    const historyRef = db.collection("history").doc();

    const batch = db.batch();

    batch.set(productRef, {
      name: name,
      category: category,
      thickness: thickness,
      size: size,
      quantity: quantity,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    batch.set(historyRef, {
      productName: name,
      category: category,
      thickness: thickness,
      size: size,
      action: "Product Added",
      amount: quantity,
      previousBalance: 0,
      balance: quantity,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await batch.commit();

    document.getElementById("thickness").value = "";
    document.getElementById("size").value = "";
    document.getElementById("opening").value = "";

    alert("Product added successfully!");

  } catch (e) {
    alert("Error: " + e.message);
  }
}

// LOAD AVAILABLE STOCK

function loadProducts() {
  db.collection("products").onSnapshot(snapshot => {
    products = [];

    snapshot.forEach(doc => {
      products.push({
        id: doc.id,
        ...doc.data()
      });
    });

    showProducts();
    updateDropdown();

    document.getElementById("status").innerText =
      "Connected successfully. Stock is up to date.";

  }, error => {
    document.getElementById("products").innerText =
      "Stock error: " + error.message;

    document.getElementById("status").innerText =
      "Firestore error: " + error.message;
  });
}

// DISPLAY STOCK

function showProducts() {
  const search = document.getElementById("search")
    .value.toLowerCase();

  const box = document.getElementById("products");
  box.innerHTML = "";

  const filtered = products.filter(p =>
    (p.name || "").toLowerCase().includes(search) ||
    (p.size || "").toLowerCase().includes(search) ||
    (p.category || "").toLowerCase().includes(search)
  );

  if (filtered.length === 0) {
    box.innerText = "No products found.";
    return;
  }

  filtered.forEach(p => {
    const div = document.createElement("div");
    div.className = "product";

    const title = document.createElement("h3");
    title.textContent = p.name || "Product";

    const details = document.createElement("p");
    details.textContent = "Size: " + (p.size || "-");

    const stock = document.createElement("h3");
    stock.textContent =
      "Available: " + (p.quantity ?? 0) + " sheets/units";

    div.append(title, details, stock);
    box.appendChild(div);
  });
}

// PRODUCT DROPDOWN

function updateDropdown() {
  const select = document.getElementById("productSelect");
  const oldValue = select.value;

  select.innerHTML = "";

  if (products.length === 0) {
    const option = document.createElement("option");
    option.textContent = "No products available";
    option.value = "";
    select.appendChild(option);
    return;
  }

  products.forEach(p => {
    const option = document.createElement("option");

    option.value = p.id;
    option.textContent =
      (p.name || "Product") + " | " +
      (p.size || "-") + " | Stock: " +
      (p.quantity ?? 0);

    select.appendChild(option);
  });

  if (products.some(p => p.id === oldValue)) {
    select.value = oldValue;
  }
}

// ADD OR REMOVE STOCK

async function changeStock(direction) {
  const id = document.getElementById("productSelect").value;
  const amountValue = document.getElementById("amount").value;
  const amount = Number(amountValue);

  if (
    !id ||
    amountValue === "" ||
    !Number.isInteger(amount) ||
    amount <= 0
  ) {
    alert("Select a product and enter a valid quantity.");
    return;
  }

  try {
    await db.runTransaction(async transaction => {
      const productRef = db.collection("products").doc(id);
      const doc = await transaction.get(productRef);

      if (!doc.exists) {
        throw new Error("Product not found.");
      }

      const data = doc.data();
      const oldStock = Number(data.quantity) || 0;
      const newStock = oldStock + (amount * direction);

      if (newStock < 0) {
        throw new Error("Not enough stock available!");
      }

      const historyRef = db.collection("history").doc();

      transaction.update(productRef, {
        quantity: newStock
      });

      transaction.set(historyRef, {
        productName: data.name || "Product",
        category: data.category || "",
        thickness: data.thickness || "",
        size: data.size || "",
        action: direction === 1 ? "Stock Added" : "Stock Removed",
        amount: amount,
        previousBalance: oldStock,
        balance: newStock,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });

    document.getElementById("amount").value = "";

    alert("Stock updated successfully!");

  } catch (e) {
    alert("Error: " + e.message);
  }
}

// STOCK HISTORY

function loadHistory() {
  db.collection("history")
    .orderBy("createdAt", "desc")
    .limit(200)
    .onSnapshot(snapshot => {

      const box = document.getElementById("history");
      box.innerHTML = "";

      if (snapshot.empty) {
        box.innerText = "No history available.";
        return;
      }

      snapshot.forEach(doc => {
        const h = doc.data();

        const div = document.createElement("div");
        div.className = "history";

        const title = document.createElement("b");
        title.textContent = h.productName || "Product";

        const action = document.createElement("p");
        action.textContent =
          (h.action || "Stock update") + " : " + (h.amount ?? 0);

        action.className =
          h.action === "Stock Added" ? "green" :
          (h.action === "Stock Removed" ||
           h.action === "Stock Sold/Removed") ? "red" : "";

        const balance = document.createElement("p");
        balance.textContent =
          "Remaining stock: " +
          (h.balance !== undefined ? h.balance : "-");

        const date = document.createElement("p");
        date.className = "small";

        date.textContent =
          h.createdAt && h.createdAt.toDate
            ? h.createdAt.toDate().toLocaleString("en-IN")
            : "Time pending";

        div.append(title, action, balance, date);
        box.appendChild(div);
      });

    }, error => {
      document.getElementById("history").innerText =
        "History error: " + error.message;
    });
}

// DELETE HISTORY ONLY

async function deleteHistory() {
  const confirmDelete = confirm(
    "Delete all history? Available stock will NOT change."
  );

  if (!confirmDelete) return;

  try {
    const snapshot = await db.collection("history").get();
    const docs = snapshot.docs;

    for (let i = 0; i < docs.length; i += 400) {
      const batch = db.batch();

      docs.slice(i, i + 400).forEach(doc => {
        batch.delete(doc.ref);
      });

      await batch.commit();
    }

    alert("History deleted. Stock remains unchanged.");

  } catch (e) {
    alert("Error: " + e.message);
  }
}

// START WEBSITE

start();

</script>
</body>
</html>
